<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Sem conexão · Projeto 30</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: #050505;
        color: #f5f5f5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }
      main {
        max-width: 28rem;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: rgba(245, 245, 245, 0.68);
        margin: 0 0 1.5rem;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-family: ui-monospace, "IBM Plex Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(245, 245, 245, 0.55);
        margin-bottom: 1.75rem;
      }
      #status .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #ff6a00;
      }
      #status.online .dot {
        background: #4ade80;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      button,
      a.button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: #f5f5f5;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.75rem 1.25rem;
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      button.primary {
        background: #ff6a00;
        border-color: #ff6a00;
        color: #050505;
      }
      button:active,
      a.button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff9a3d" stroke-width="2">
          <path
            d="M12 20h.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M2 9.5a15 15 0 0 1 20 0"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M1 1l22 22" stroke-linecap="round" />
        </svg>
      </div>
      <h1>Você está sem conexão.</h1>
      <p>
        Alguns conteúdos já acessados continuam disponíveis. Para registrar progresso ou atualizar
        informações, conecte-se novamente.
      </p>
      <div id="status" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-label">Sem conexão</span>
      </div>
      <div class="actions">
        <button class="primary" id="retry" type="button">Tentar novamente</button>
        <a class="button" href="/app/hoje">Ver conteúdo já disponível</a>
      </div>
    </main>
    <script>
      var statusEl = document.getElementById("status");
      var statusLabel = document.getElementById("status-label");

      function renderConnectivity() {
        if (navigator.onLine) {
          statusEl.classList.add("online");
          statusLabel.textContent = "Conexão restabelecida";
        } else {
          statusEl.classList.remove("online");
          statusLabel.textContent = "Sem conexão";
        }
      }

      window.addEventListener("online", function () {
        renderConnectivity();
        // Connectivity is back - return automatically to where the user was
        // heading instead of leaving them stuck on this page.
        window.location.reload();
      });
      window.addEventListener("offline", renderConnectivity);
      renderConnectivity();

      // navigator.onLine is well known to be unreliable right after this
      // exact document loads (it can reflect stale state briefly,
      // particularly when this page was served by the service worker from
      // Cache Storage rather than a real network round trip). A tiny
      // same-origin probe with a short timeout gives a truthful initial
      // reading without waiting on the user to trigger an online/offline
      // event first.
      function probeConnectivity() {
        var controller = new AbortController();
        var timeout = setTimeout(function () {
          controller.abort();
        }, 2500);
        // Deliberately not an asset the service worker itself caches (see
        // sw.js isStaticAsset/isNetworkFirstPage) - otherwise this would
        // always "succeed" from Cache Storage regardless of real
        // connectivity. The manifest is never intercepted by sw.js, so this
        // genuinely round-trips to the network.
        fetch("/manifest.webmanifest", { cache: "no-store", signal: controller.signal })
          .then(function () {
            clearTimeout(timeout);
            statusEl.classList.add("online");
            statusLabel.textContent = "Conexão restabelecida";
          })
          .catch(function () {
            clearTimeout(timeout);
            // The probe itself just proved the network is unreachable -
            // trust that directly rather than falling back to
            // navigator.onLine, which is exactly the unreliable signal this
            // probe exists to correct.
            statusEl.classList.remove("online");
            statusLabel.textContent = "Sem conexão";
          });
      }
      probeConnectivity();

      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
